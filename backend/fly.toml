app = "theboernedirtplace-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

  [http_service.concurrency]
    type = "requests"
    hard_limit = 1000
    soft_limit = 500

[env]
  CORS_ORIGINS = "https://theboernedirtplace.com,https://www.theboernedirtplace.com"
  R2_BUCKET_NAME = "dirt-place-images"
  CDN_BASE = "https://cdn.theboernedirtplace.com"
