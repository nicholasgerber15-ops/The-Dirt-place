# Render Blueprint - The Dirt Place
# Fix: MongoDB SSL fallback to demo mode
# Import: render blueprint apply render.yaml

previewsEnabled: true

services:
  # === BACKEND API ===
  - name: the-dirt-place-backend
    runtime: python
    region: oregon
    plan: free
    repo: https://github.com/nicholasgerber15-ops/The-Dirt-place
    branch: Version-2
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
        value: dirtplace2024
      - key: CORS_ORIGINS
        sync: false
        value: "*"
      - key: RESEND_API_KEY
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
        value: dirt-place-images
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: FORCE_DEMO
        value: "true"

  # === FRONTEND ===
  - name: the-dirt-place
    runtime: static
    repo: https://github.com/nicholasgerber15-ops/The-Dirt-place
    branch: Version-2
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build --legacy-peer-deps
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
        value: https://the-dirt-place-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html