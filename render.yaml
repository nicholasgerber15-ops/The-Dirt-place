# Fix: MongoDB SSL fallback to demo mode
# Import: render blueprint apply render.yaml
previewsEnabled: true
services:
  # === BACKEND API ===
  - name: the-dirt-place-1
    runtime: python-3.11
    region: oregon
    plan: free
    repo: https://github.com/nicholasgerber15-ops/The-Dirt-place
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CDN_BASE
        value: https://cdn.theboernedirtplace.com
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "https://theboernedirtplace.com,https://the-dirt-place.onrender.com,https://the-dirt-place-frontend.onrender.com"
      - key: RESEND_API_KEY
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: dirt-place-images
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: FORCE_DEMO
        value: "true"
  # === FRONTEND ===
  - name: the-dirt-place
    type: static
    runtime: static
    repo: https://github.com/nicholasgerber15-ops/The-Dirt-place
    branch: main
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build --legacy-peer-deps
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://the-dirt-place-1.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
